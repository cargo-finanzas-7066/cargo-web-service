spring.application.name=api
server.port=8080

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/cargo_platform}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

jwt.secret=CarGoSecretKeyForJWT2026MitocodeProjectAPIVehicularCreditSimulator
jwt.expiration=86400000
jwt.issuer=${JWT_ISSUER:cargo-api}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
app.bootstrap.admin-email=${ADMIN_EMAIL:}
app.bootstrap.admin-password=${ADMIN_PASSWORD:}
app.bootstrap.admin-name=${ADMIN_NAME:Administrador}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
springdoc.swagger-ui.path=/swagger-ui
springdoc.api-docs.path=/v3/api-docs